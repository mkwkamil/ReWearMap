services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rewear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rewear}
      POSTGRES_DB: ${POSTGRES_DB:-rewearmap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rewear} -d ${POSTGRES_DB:-rewearmap}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rewear}:${POSTGRES_PASSWORD:-rewear}@db:5432/${POSTGRES_DB:-rewearmap}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 192m

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    mem_limit: 64m

volumes:
  pgdata:
